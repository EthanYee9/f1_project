services: 
  postgres:
    image: postgres:latest
    ports:
    - "5434:5432"
    networks:
    - etl_network
    environment: 
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  etl_script:
    build:
      context: ./src
      dockerfile: Dockerfile 
    command: ["python", "csv_etl_script.py"]
    networks:
      - etl_network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  fast_api:
    build:
      context: ./src
      dockerfile: Dockerfile 
    command: ["uvicorn", "f1_predict_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
    - "8000:8000"
    networks:
      - etl_network
    depends_on:
      etl_script:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    env_file:
      - .env

  streamlit:
    build:
      context: ./src
      dockerfile: Dockerfile 
    command: ["streamlit", "run", "streamlit.py","--server.port=8001", "--server.address=0.0.0.0"]
    ports:
    - "8001:8001"
    networks:
      - etl_network
    depends_on:
      etl_script:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    env_file:
      - .env

networks:
  etl_network:
    driver: bridge